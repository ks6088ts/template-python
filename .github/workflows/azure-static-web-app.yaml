name: azure-static-web-apps
on:
  workflow_dispatch:
  # Uncomment the following lines to enable automatic deployment on push to main branch
  # push:
  #   branches:
  #     - main
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache in publishing workflows to avoid cache poisoning.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Build documentation
        run: make ci-test-docs
      # Upstream has both a v1 tag (pinned here) and a v1 branch, which zizmor reports as ambiguous.
      - name: Deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1 # zizmor: ignore[ref-version-mismatch]
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "./site"
          output_location: ""
          skip_app_build: true
