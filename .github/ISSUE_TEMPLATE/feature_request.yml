name: Feature request
description: Propose a change or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The simplest change that solves the problem, and alternatives considered.
    validations:
      required: true
