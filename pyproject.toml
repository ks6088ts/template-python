[project]
name = "template-python"
version = "0.0.13"
description = "A minimal, typed Python package and CLI template"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["python", "template", "typer", "uv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-settings>=2.15,<3",
    "typer>=0.27,<1",
]

[project.scripts]
template-python = "template_python.cli:app"

[project.urls]
Documentation = "https://ks6088ts-labs.github.io/template-python"
Issues = "https://github.com/ks6088ts/template-python/issues"
Repository = "https://github.com/ks6088ts/template-python"

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocs-static-i18n>=1.3,<2",
]
test = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
]
dev = [
    { include-group = "test" },
    "mypy>=2.4,<3",
    "prek>=0.5.4,<0.6",
    "ruff>=0.16.9,<0.17",
    "zizmor>=1.30.1,<2",
]
notebook = [
    "jupyterlab>=4.6,<5",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PT", "RUF", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "-ra --cov=src/template_python"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
show_error_codes = true
plugins = ["pydantic.mypy"]
