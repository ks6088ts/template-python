[project]
name = "template-python"
version = "0.0.13"
description = "A minimal, typed Python CLI template with a production-grade toolchain"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ks6088ts" }]
keywords = ["cli", "python", "template", "typer", "uv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.15,<3",
    "typer>=0.27,<1",
]

[project.scripts]
template-python = "template_python.cli:app"

[project.urls]
Documentation = "https://ks6088ts-labs.github.io/template-python"
Issues = "https://github.com/ks6088ts/template-python/issues"
Repository = "https://github.com/ks6088ts/template-python"

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocs-static-i18n>=1.3,<2",
]
test = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
]
dev = [
    { include-group = "test" },
    "actionlint-py>=1.7.12,<2",
    "mypy>=2.4,<3",
    "pip-audit>=2.10,<3",
    "prek>=0.5.4,<0.6",
    "ruff>=0.17.1,<0.18",
    "zizmor>=1.30.1,<2",
]
notebook = [
    "jupyterlab>=4.6,<5",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.1,<0.14"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "ERA",   # eradicate (commented-out code)
    "F",     # pyflakes
    "FBT",   # flake8-boolean-trap
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "I",     # isort
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # perflint
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RUF",   # ruff-specific
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# Typer declares boolean flags as keyword parameters with defaults.
"src/template_python/cli.py" = ["FBT001", "FBT002"]
"tests/**" = ["PLR2004", "S101"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--cov", "--cov-report=term-missing"]
strict = true
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_pkgs = ["template_python"]

[tool.coverage.report]
fail_under = 95
show_missing = true
partial_also = ['if __name__ == "__main__":']

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
